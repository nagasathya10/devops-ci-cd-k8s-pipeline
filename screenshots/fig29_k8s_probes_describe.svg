    </style>
  </defs>
  <rect width="880" height="230" class="bg" />
  <path d="M0 8C0 3.58 3.58 0 8 0h864c4.42 0 8 3.58 8 8v22H0V8z" class="header" />
  <circle cx="16" cy="15" r="4.5" fill="#f38ba8" />
  <circle cx="32" cy="15" r="4.5" fill="#f9e2af" />
  <circle cx="48" cy="15" r="4.5" fill="#a6e3a1" />
  <text x="440.0" y="19" text-anchor="middle" class="title">zsh — devops-ci-cd-k8s-pipeline — kubectl describe deployment probes</text>
  <g transform="translate(16, 42)" class="term">
    <text x="0" y="0"><tspan class="prompt">nagasathya@macbook:~/devops-ci-cd-k8s-pipeline$ </tspan><tspan class="cmd">kubectl describe deployment todo-api | grep -A 8 -E "Liveness|Readiness"</tspan></text>
    <text x="0" y="18"><tspan class="white">    </tspan><tspan class="blue">Liveness:</tspan><tspan class="white">     http-get http://:5000/health delay=10s timeout=2s period=5s #success=1 #failure=3</tspan></text>
    <text x="0" y="36"><tspan class="white">    </tspan><tspan class="blue">Readiness:</tspan><tspan class="white">    http-get http://:5000/health delay=5s timeout=2s period=5s #success=1 #failure=3</tspan></text>
    <text x="0" y="54"><tspan class="white">    Environment:</tspan></text>
    <text x="0" y="72"><tspan class="white">      APP_ENV:   &lt;set to the key &apos;APP_ENV&apos; of config map &apos;todo-api-config&apos;&gt;  Optional: false</tspan></text>
    <text x="0" y="90"><tspan class="white">      APP_PORT:  &lt;set to the key &apos;APP_PORT&apos; of config map &apos;todo-api-config&apos;&gt; Optional: false</tspan></text>
    <text x="0" y="108"><tspan class="dim">-----------------------------------------------------------------------------------</tspan></text>
    <text x="0" y="126"><tspan class="green">✓ Health checking configuration active: restarts unhealth pods, gates traffic on ready</tspan></text>
  </g>
