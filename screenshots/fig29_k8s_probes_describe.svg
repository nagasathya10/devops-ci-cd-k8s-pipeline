      .title { fill: #cdd6f4; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 500; }
      .term { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 11px; }
      .prompt { fill: #89b4fa; font-weight: bold; }
      .cmd { fill: #f5e0dc; }
      .green { fill: #a6e3a1; font-weight: 600; }
      .blue { fill: #89b4fa; }
      .yellow { fill: #f9e2af; }
      .red { fill: #f38ba8; font-weight: bold; }
      .dim { fill: #6c7086; }
      .white { fill: #cdd6f4; }
      .cyan { fill: #89dceb; }
