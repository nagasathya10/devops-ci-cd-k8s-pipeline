<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 440" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #1e1e2e; rx: 12px; }
      .header { fill: #181825; }
      .title { fill: #cdd6f4; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 500; }
      .prompt { fill: #89b4fa; font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; }
      .cmd { fill: #f5e0dc; font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 12px; }
      .table-hdr { fill: #6c7086; font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
      .text-light { fill: #cdd6f4; font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
      .json-key { fill: #f38ba8; font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
      .json-val { fill: #a6e3a1; font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
      .status-ok { fill: #a6e3a1; font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 12px; font-weight: bold; }
    </style>
  </defs>

  <rect width="950" height="440" class="bg" />
  <path d="M0 12C0 5.373 5.373 0 12 0h926c6.627 0 12 5.373 12 12v28H0V12z" class="header" />
  <circle cx="20" cy="20" r="6" fill="#f38ba8" />
  <circle cx="40" cy="20" r="6" fill="#f9e2af" />
  <circle cx="60" cy="20" r="6" fill="#a6e3a1" />
  <text x="475" y="24" text-anchor="middle" class="title">Terminal — Kubernetes NodePort Service &amp; Live REST API Testing</text>

  <g transform="translate(25, 55)">
    <text x="0" y="0" class="prompt">nagasathya10@macbook:~$ <tspan class="cmd">kubectl get svc todo-api-service</tspan></text>
    <text x="0" y="20" class="table-hdr">NAME               TYPE       CLUSTER-IP      EXTERNAL-IP   PORT(S)          AGE</text>
    <text x="0" y="38" class="text-light"><tspan fill="#89dceb">todo-api-service</tspan>   NodePort   10.96.142.88    &lt;none&gt;        5000:<tspan fill="#fab387">30080</tspan>/TCP   4m12s</text>

    <!-- Curl Health -->
    <text x="0" y="75" class="prompt">nagasathya10@macbook:~$ <tspan class="cmd">curl -i http://localhost:30080/health</tspan></text>
    <text x="0" y="95" class="status-ok">HTTP/1.1 200 OK</text>
    <text x="0" y="113" class="text-light">Content-Type: application/json</text>
    <text x="0" y="131" class="text-light">{</text>
    <text x="20" y="149" class="text-light"><tspan class="json-key">"active_tasks"</tspan>: <tspan class="json-val">2</tspan>,</text>
    <text x="20" y="167" class="text-light"><tspan class="json-key">"status"</tspan>: <tspan class="json-val">"UP"</tspan>,</text>
    <text x="20" y="185" class="text-light"><tspan class="json-key">"timestamp"</tspan>: <tspan class="json-val">"2026-11-15T08:30:14Z"</tspan>,</text>
    <text x="20" y="203" class="text-light"><tspan class="json-key">"uptime_seconds"</tspan>: <tspan class="json-val">245</tspan></text>
    <text x="0" y="221" class="text-light">}</text>

    <!-- Curl Todos -->
    <text x="0" y="255" class="prompt">nagasathya10@macbook:~$ <tspan class="cmd">curl -s http://localhost:30080/todos | jq</tspan></text>
    <text x="0" y="275" class="text-light">{</text>
    <text x="20" y="293" class="text-light"><tspan class="json-key">"count"</tspan>: <tspan class="json-val">2</tspan>,</text>
    <text x="20" y="311" class="text-light"><tspan class="json-key">"success"</tspan>: <tspan class="json-val">true</tspan>,</text>
    <text x="20" y="329" class="text-light"><tspan class="json-key">"data"</tspan>: [ { <tspan class="json-key">"id"</tspan>: <tspan class="json-val">1</tspan>, <tspan class="json-key">"title"</tspan>: <tspan class="json-val">"Set up CI/CD Pipeline"</tspan>, <tspan class="json-key">"completed"</tspan>: <tspan class="json-val">true</tspan> },</text>
    <text x="65" y="347" class="text-light">{ <tspan class="json-key">"id"</tspan>: <tspan class="json-val">2</tspan>, <tspan class="json-key">"title"</tspan>: <tspan class="json-val">"Deploy to Kubernetes"</tspan>, <tspan class="json-key">"completed"</tspan>: <tspan class="json-val">false</tspan> } ]</text>
    <text x="0" y="365" class="text-light">}</text>
  </g>
</svg>
