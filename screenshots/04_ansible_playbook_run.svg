  <circle cx="40" cy="20" r="6" fill="#f9e2af" />
  <circle cx="60" cy="20" r="6" fill="#a6e3a1" />
  <text x="475" y="24" text-anchor="middle" class="title">Terminal — Ansible Playbook Execution (Component 2)</text>

  <g transform="translate(25, 60)">
    <text x="0" y="0" class="prompt">nagasathya10@macbook:~/devops-ci-cd-k8s-pipeline/ansible$ <tspan class="cmd">ansible-playbook -i inventory.ini playbook.yml</tspan></text>

    <text x="0" y="26" class="play">PLAY [Deploy and Configure DevOps REST API Service] *********************************</text>

    <text x="0" y="50" class="task">TASK [Gathering Facts] *************************************************************</text>
    <text x="0" y="68" class="ok">ok: [localhost]</text>

    <text x="0" y="92" class="task">TASK [todo_app : Create dedicated application service group &amp; user] *****************</text>
    <text x="0" y="110" class="ok">ok: [localhost]</text>

    <text x="0" y="134" class="task">TASK [todo_app : Copy application source code to target server] *********************</text>
    <text x="0" y="152" class="changed">changed: [localhost]</text>

    <text x="0" y="176" class="task">TASK [todo_app : Deploy systemd service unit configuration file] ********************</text>
