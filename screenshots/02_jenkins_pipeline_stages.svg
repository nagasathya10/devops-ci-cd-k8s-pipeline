<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 420" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8f9fa; rx: 8px; stroke: #dee2e6; stroke-width: 1px; }
      .nav { fill: #1f2328; }
      .nav-text { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 600; }
      .heading { fill: #212529; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: bold; }
      .subheading { fill: #6c757d; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; }
      .stage-card { fill: #d1e7dd; stroke: #0f5132; stroke-width: 1.5px; rx: 6px; }
      .stage-header { fill: #0f5132; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: bold; }
      .stage-time { fill: #146c43; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; }
      .badge-success { fill: #198754; rx: 4px; }
      .badge-text { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: bold; }
      .meta-label { fill: #495057; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; }
      .meta-val { fill: #0d6efd; font-family: monospace; font-size: 12px; }
    </style>
  </defs>

  <rect width="950" height="420" class="bg" />

  <!-- Navbar -->
  <rect width="950" height="48" class="nav" rx="8" />
  <rect y="40" width="950" height="8" class="nav" />
  <circle cx="30" cy="24" r="14" fill="#d24939" />
  <text x="30" y="29" fill="#fff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">J</text>
  <text x="56" y="29" class="nav-text">Jenkins &gt; DevOps-Todo-API-CI &gt; Build #1</text>
  <rect x="800" y="12" width="120" height="24" fill="#343a40" rx="4" />
  <text x="860" y="28" fill="#fff" font-family="sans-serif" font-size="11" text-anchor="middle">Nagasathya V</text>

  <!-- Title section -->
  <text x="35" y="85" class="heading">Pipeline DevOps-Todo-API-CI [Branch: main]</text>
  <text x="35" y="108" class="subheading">Triggered by SCM polling (Git commit 6d6e5f3) | USN: 1MS24CY041</text>

  <!-- Build Info Box -->
  <rect x="35" y="125" width="880" height="45" fill="#ffffff" stroke="#ced4da" rx="6" />
  <rect x="45" y="137" width="70" height="22" class="badge-success" />
  <text x="80" y="152" text-anchor="middle" class="badge-text">SUCCESS</text>
  <text x="130" y="152" class="meta-label">Git Commit: <tspan class="meta-val">6d6e5f3</tspan></text>
  <text x="340" y="152" class="meta-label">Duration: <tspan fill="#212529" font-family="sans-serif">42s</tspan></text>
  <text x="450" y="152" class="meta-label">Artifact: <tspan class="meta-val">devops-todo-api-1-6d6e5f3.tar.gz</tspan></text>
  <text x="730" y="152" class="meta-label">Tests: <tspan fill="#198754" font-weight="bold">8 passed (100%)</tspan></text>

  <!-- Stage View -->
  <text x="35" y="200" font-family="sans-serif" font-size="14" font-weight="bold" fill="#333">Stage View — 5 Stages Succeeded</text>

  <!-- Stage 1 -->
  <g transform="translate(35, 215)">
    <rect width="160" height="170" class="stage-card" />
    <circle cx="80" cy="40" r="16" fill="#198754" />
    <path d="M73 40 l5 5 l10 -10" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" />
    <text x="80" y="75" text-anchor="middle" class="stage-header">Checkout SCM</text>
    <text x="80" y="95" text-anchor="middle" class="stage-time">Duration: 4s</text>
    <text x="80" y="130" text-anchor="middle" font-size="11" fill="#495057">Fetch git tree</text>
    <text x="80" y="148" text-anchor="middle" font-size="10" fill="#6c757d">refs/heads/main</text>
  </g>

  <!-- Stage 2 -->
  <g transform="translate(215, 215)">
    <rect width="160" height="170" class="stage-card" />
    <circle cx="80" cy="40" r="16" fill="#198754" />
    <path d="M73 40 l5 5 l10 -10" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" />
    <text x="80" y="75" text-anchor="middle" class="stage-header">Env Setup</text>
    <text x="80" y="95" text-anchor="middle" class="stage-time">Duration: 11s</text>
    <text x="80" y="130" text-anchor="middle" font-size="11" fill="#495057">Python 3.11 venv</text>
    <text x="80" y="148" text-anchor="middle" font-size="10" fill="#6c757d">pip install -r reqs</text>
  </g>

  <!-- Stage 3 -->
  <g transform="translate(395, 215)">
    <rect width="160" height="170" class="stage-card" />
    <circle cx="80" cy="40" r="16" fill="#198754" />
    <path d="M73 40 l5 5 l10 -10" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" />
    <text x="80" y="75" text-anchor="middle" class="stage-header">Automated Tests</text>
    <text x="80" y="95" text-anchor="middle" class="stage-time">Duration: 7s</text>
    <text x="80" y="130" text-anchor="middle" font-size="11" fill="#495057">pytest (8 tests)</text>
    <text x="80" y="148" text-anchor="middle" font-size="10" fill="#198754" font-weight="bold">JUnit XML: 0 fails</text>
  </g>

  <!-- Stage 4 -->
  <g transform="translate(575, 215)">
    <rect width="160" height="170" class="stage-card" />
    <circle cx="80" cy="40" r="16" fill="#198754" />
    <path d="M73 40 l5 5 l10 -10" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" />
    <text x="80" y="75" text-anchor="middle" class="stage-header">Package Artifact</text>
    <text x="80" y="95" text-anchor="middle" class="stage-time">Duration: 5s</text>
    <text x="80" y="130" text-anchor="middle" font-size="11" fill="#495057">tar.gz versioned</text>
    <text x="80" y="148" text-anchor="middle" font-size="10" fill="#0d6efd">Fingerprint saved</text>
  </g>

  <!-- Stage 5 -->
  <g transform="translate(755, 215)">
    <rect width="160" height="170" class="stage-card" />
    <circle cx="80" cy="40" r="16" fill="#198754" />
    <path d="M73 40 l5 5 l10 -10" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" />
    <text x="80" y="75" text-anchor="middle" class="stage-header">Docker Build</text>
    <text x="80" y="95" text-anchor="middle" class="stage-time">Duration: 15s</text>
    <text x="80" y="130" text-anchor="middle" font-size="11" fill="#495057">Multi-stage image</text>
    <text x="80" y="148" text-anchor="middle" font-size="10" fill="#6c757d">devops-todo-api:latest</text>
  </g>
</svg>
