[app_servers]
# Local target host (runs directly or inside container/local VM)
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3

# Example remote server target:
# target-node1 ansible_host=192.168.56.101 ansible_user=vagrant ansible_ssh_private_key_file=~/.ssh/id_rsa

[app_servers:vars]
ansible_user_group=staff
