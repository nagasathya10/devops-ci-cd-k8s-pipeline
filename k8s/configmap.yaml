apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-api-config
  labels:
    app: todo-api
    component: backend
data:
  # Deployment Enhancement: Decoupling configuration from pod specification
  PORT: "5000"
  HOST: "0.0.0.0"
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  APP_VERSION: "1.0.0"
