apiVersion: v1
kind: Service
metadata:
  name: todo-api-service
  labels:
    app: todo-api
spec:
  type: NodePort
  selector:
    # Must match the Deployment label exactly for internal routing
    app: todo-api
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
      nodePort: 30080
      name: http
