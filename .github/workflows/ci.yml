name: DevOps CI Pipeline

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    name: Test, Build & Version Artifact
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Code from Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Automated Tests with Pytest (CI Enhancement)
        run: |
          python -m pytest app/test_app.py -v --junitxml=junit-${{ matrix.python-version }}.xml

      - name: Generate Versioned Artifact (CI Enhancement)
        if: matrix.python-version == '3.11'
        run: |
          GIT_SHA=$(git rev-parse --short HEAD)
          BUILD_TAG="1.0.0-${GIT_SHA}"
          mkdir -p dist
          tar --exclude='__pycache__' -czvf dist/devops-todo-api-${BUILD_TAG}.tar.gz app requirements.txt Dockerfile
          echo "PACKAGED_FILE=devops-todo-api-${BUILD_TAG}.tar.gz" >> $GITHUB_ENV
          echo "Successfully created versioned artifact: devops-todo-api-${BUILD_TAG}.tar.gz"

      - name: Archive Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-python-${{ matrix.python-version }}
          path: junit-*.xml

      - name: Archive Build Artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: app-dist-package
          path: dist/*.tar.gz

  docker-build:
    name: Docker Image Build & Validation
    needs: test-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Validate Docker Container
        run: |
          GIT_SHA=$(git rev-parse --short HEAD)
          docker build -t devops-todo-api:${GIT_SHA} -t devops-todo-api:latest .
          docker image ls | grep devops-todo-api
