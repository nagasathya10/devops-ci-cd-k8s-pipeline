<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 360" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
  </defs>
  <rect width="950" height="360" fill="#ffffff" rx="10" stroke="#e2e8f0" stroke-width="1.5" />
  <rect x="0" y="0" width="950" height="42" fill="#0f172a" rx="10 10 0 0" />
  <text x="25" y="27" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">JENKINS DECLARATIVE CI/CD PIPELINE LIFECYCLE</text>
  <text x="720" y="27" font-family="sans-serif" font-size="11" fill="#94a3b8">Trigger: Poll SCM (H/2 * * * *)</text>

  <!-- Trigger Box -->
  <rect x="30" y="80" width="120" height="150" fill="#eff6ff" rx="8" stroke="#3b82f6" stroke-width="1.5" />
  <text x="90" y="105" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="middle">TRIGGER</text>
  <text x="90" y="125" font-family="monospace" font-size="10" fill="#2563eb" text-anchor="middle">Poll SCM</text>
  <text x="90" y="145" font-family="monospace" font-size="9" fill="#64748b" text-anchor="middle">H/2 * * * *</text>
  <text x="90" y="175" font-family="sans-serif" font-size="9" fill="#334155" text-anchor="middle">Git SCM Poll</text>
  <text x="90" y="190" font-family="sans-serif" font-size="9" fill="#10b981" font-weight="bold" text-anchor="middle">Changes Found</text>
  <text x="90" y="210" font-family="monospace" font-size="8.5" fill="#475569" text-anchor="middle">Build #2 Started</text>

  <path d="M 150 155 L 180 155" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Stage 1: Checkout -->
  <rect x="180" y="80" width="130" height="150" fill="#f8fafc" rx="8" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="245" y="105" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">1. CHECKOUT</text>
  <text x="245" y="130" font-family="monospace" font-size="9.5" fill="#334155" text-anchor="middle">checkout scm</text>
  <text x="245" y="150" font-family="monospace" font-size="9" fill="#64748b" text-anchor="middle">branch: */main</text>
  <text x="245" y="175" font-family="sans-serif" font-size="9" fill="#047857" text-anchor="middle">Extract GIT_SHA</text>
  <text x="245" y="195" font-family="monospace" font-size="8.5" fill="#2563eb" text-anchor="middle">APP_VERSION =</text>
  <text x="245" y="210" font-family="monospace" font-size="8.5" fill="#2563eb" text-anchor="middle">"1.0.${BUILD_NUM}"</text>

  <path d="M 310 155 L 340 155" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Stage 2: Test -->
  <rect x="340" y="80" width="130" height="150" fill="#f0fdf4" rx="8" stroke="#86efac" stroke-width="1.5" />
  <text x="405" y="105" font-family="sans-serif" font-size="11" font-weight="bold" fill="#065f46" text-anchor="middle">2. TEST (PYTEST)</text>
  <text x="405" y="130" font-family="monospace" font-size="9.5" fill="#047857" text-anchor="middle">make test</text>
  <text x="405" y="150" font-family="monospace" font-size="9" fill="#334155" text-anchor="middle">pytest -v</text>
  <text x="405" y="170" font-family="monospace" font-size="8.5" fill="#64748b" text-anchor="middle">--junitxml=...</text>
  <text x="405" y="195" font-family="sans-serif" font-size="9.5" font-weight="bold" fill="#10b981" text-anchor="middle">8/8 Passed (100%)</text>
  <text x="405" y="210" font-family="sans-serif" font-size="8.5" fill="#047857" text-anchor="middle">Fail-fast verification</text>

  <path d="M 470 155 L 500 155" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Stage 3: Package -->
  <rect x="500" y="80" width="130" height="150" fill="#fdf4ff" rx="8" stroke="#f0abfc" stroke-width="1.5" />
  <text x="565" y="105" font-family="sans-serif" font-size="11" font-weight="bold" fill="#701a75" text-anchor="middle">3. PACKAGE DIST</text>
  <text x="565" y="130" font-family="monospace" font-size="9.5" fill="#86198f" text-anchor="middle">make package</text>
  <text x="565" y="155" font-family="sans-serif" font-size="9" fill="#334155" text-anchor="middle">Compress artifacts</text>
  <text x="565" y="175" font-family="monospace" font-size="8" fill="#64748b" text-anchor="middle">dist/todo-api-</text>
  <text x="565" y="190" font-family="monospace" font-size="8" fill="#64748b" text-anchor="middle">1.0.2.tar.gz</text>
  <text x="565" y="210" font-family="sans-serif" font-size="8.5" fill="#10b981" text-anchor="middle">Archive Ready</text>

  <path d="M 630 155 L 660 155" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Stage 4: Docker Containerize -->
  <rect x="660" y="80" width="130" height="150" fill="#f0fdfa" rx="8" stroke="#5eead4" stroke-width="1.5" />
  <text x="725" y="105" font-family="sans-serif" font-size="11" font-weight="bold" fill="#134e4a" text-anchor="middle">4. DOCKER BUILD</text>
  <text x="725" y="130" font-family="monospace" font-size="9.5" fill="#0f766e" text-anchor="middle">docker build</text>
  <text x="725" y="150" font-family="sans-serif" font-size="9" fill="#334155" text-anchor="middle">Multi-stage pipeline</text>
  <text x="725" y="170" font-family="monospace" font-size="8.5" fill="#047857" text-anchor="middle">builder -> runner</text>
  <text x="725" y="190" font-family="monospace" font-size="8.5" fill="#64748b" text-anchor="middle">todo-api:${TAG}</text>
  <text x="725" y="210" font-family="sans-serif" font-size="8.5" fill="#0f766e" text-anchor="middle">Non-root UID 10001</text>

  <path d="M 790 155 L 820 155" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Post Actions -->
  <rect x="820" y="80" width="110" height="150" fill="#fef2f2" rx="8" stroke="#fca5a5" stroke-width="1.5" />
  <text x="875" y="105" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b" text-anchor="middle">POST ACTIONS</text>
  <text x="875" y="130" font-family="monospace" font-size="9" fill="#b91c1c" text-anchor="middle">junit 'reports'</text>
  <text x="875" y="155" font-family="monospace" font-size="8.5" fill="#b91c1c" text-anchor="middle">archiveArtifacts</text>
  <text x="875" y="175" font-family="monospace" font-size="8" fill="#475569" text-anchor="middle">'dist/*.tar.gz'</text>
  <text x="875" y="205" font-family="sans-serif" font-size="9.5" font-weight="bold" fill="#15803d" text-anchor="middle">STATUS: SUCCESS</text>

  <!-- Bottom Details -->
  <rect x="30" y="255" width="900" height="85" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1" />
  <text x="50" y="278" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e293b">Key Pipeline Architectural Attributes:</text>
  <text x="50" y="298" font-family="sans-serif" font-size="10" fill="#475569">• Zero manual intervention: Git polling automatically triggers builds upon every push or merge to 'main'.</text>
  <text x="50" y="314" font-family="sans-serif" font-size="10" fill="#475569">• Gatekeeping Quality: Testing occurs prior to packaging and containerization, preventing broken releases.</text>
  <text x="50" y="330" font-family="sans-serif" font-size="10" fill="#475569">• Artifact Traceability: Every built package and Docker tag is strictly bound to the Jenkins build number and Git SHA.</text>
</svg>