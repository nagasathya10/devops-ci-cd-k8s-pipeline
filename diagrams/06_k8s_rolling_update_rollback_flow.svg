<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 380" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
  </defs>
  <rect width="950" height="380" fill="#ffffff" rx="10" stroke="#e2e8f0" stroke-width="1.5" />
  <rect x="0" y="0" width="950" height="42" fill="#0f172a" rx="10 10 0 0" />
  <text x="25" y="27" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">KUBERNETES ZERO-DOWNTIME ROLLING UPDATE &amp; ROLLBACK MECHANICS</text>
  <text x="680" y="27" font-family="sans-serif" font-size="11" fill="#94a3b8">maxSurge: 25% | maxUnavailable: 25%</text>

  <!-- Step 1: Stable State -->
  <rect x="25" y="65" width="190" height="210" fill="#f0fdf4" rx="8" stroke="#86efac" stroke-width="1.5" />
  <text x="120" y="90" font-family="sans-serif" font-size="11" font-weight="bold" fill="#065f46" text-anchor="middle">1. STABLE STATE (REV 1)</text>
  <text x="120" y="110" font-family="monospace" font-size="9.5" fill="#047857" text-anchor="middle">Image: todo-api:1.0</text>
  <rect x="35" y="125" width="170" height="35" fill="#ffffff" rx="4" stroke="#a7f3d0" stroke-width="1" />
  <text x="45" y="145" font-family="monospace" font-size="8.5" fill="#065f46">Old Pod 1 [Healthy]</text>
  <rect x="35" y="165" width="170" height="35" fill="#ffffff" rx="4" stroke="#a7f3d0" stroke-width="1" />
  <text x="45" y="185" font-family="monospace" font-size="8.5" fill="#065f46">Old Pod 2 [Healthy]</text>
  <rect x="35" y="205" width="170" height="35" fill="#ffffff" rx="4" stroke="#a7f3d0" stroke-width="1" />
  <text x="45" y="225" font-family="monospace" font-size="8.5" fill="#065f46">Old Pod 3 [Healthy]</text>
  <text x="120" y="260" font-family="sans-serif" font-size="9" font-weight="bold" fill="#047857" text-anchor="middle">3/3 Replicas Serving Traffic</text>

  <path d="M 215 170 L 255 170" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 2: Broken Release Triggered -->
  <rect x="260" y="65" width="205" height="210" fill="#fff7ed" rx="8" stroke="#fdba74" stroke-width="1.5" />
  <text x="362" y="90" font-family="sans-serif" font-size="11" font-weight="bold" fill="#9a3412" text-anchor="middle">2. DEPLOY BROKEN (REV 2)</text>
  <text x="362" y="108" font-family="monospace" font-size="8.5" fill="#c2410c" text-anchor="middle">Image: todo-api:1.1 (PORT 9999)</text>
  <text x="270" y="128" font-family="sans-serif" font-size="8.5" fill="#475569">RollingUpdate Arithmetic:</text>
  <text x="270" y="145" font-family="monospace" font-size="8" fill="#334155">• maxSurge: 25% (ceil -> 1)</text>
  <text x="270" y="160" font-family="monospace" font-size="8" fill="#334155">• maxUnavailable: 25% (floor -> 0)</text>
  <rect x="270" y="170" width="185" height="40" fill="#fef2f2" rx="4" stroke="#fca5a5" stroke-width="1" />
  <text x="280" y="187" font-family="monospace" font-size="8" font-weight="bold" fill="#b91c1c">New Pod 4 Spawns (Surge)</text>
  <text x="280" y="202" font-family="monospace" font-size="8" fill="#991b1b">Probe: /health on 5000 -> FAIL</text>
  <text x="362" y="235" font-family="sans-serif" font-size="8.5" font-weight="bold" fill="#b91c1c" text-anchor="middle">Readiness: 0/1 READY</text>
  <text x="362" y="255" font-family="sans-serif" font-size="8" fill="#047857" text-anchor="middle">3 Old Pods KEPT ALIVE!</text>

  <path d="M 465 170 L 505 170" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 3: Rollout Gating -->
  <rect x="510" y="65" width="200" height="210" fill="#fef2f2" rx="8" stroke="#fca5a5" stroke-width="1.5" />
  <text x="610" y="90" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b" text-anchor="middle">3. TRAFFIC GATED &amp; BLOCKED</text>
  <text x="610" y="112" font-family="sans-serif" font-size="8.5" fill="#7f1d1d" text-anchor="middle">Zero Broken Traffic Routed</text>
  <text x="520" y="135" font-family="sans-serif" font-size="8.5" fill="#334155">• Broken pod not added to</text>
  <text x="530" y="150" font-family="monospace" font-size="8" fill="#2563eb">Endpoints list</text>
  <text x="520" y="170" font-family="sans-serif" font-size="8.5" fill="#334155">• Old pods remain at 100%</text>
  <text x="520" y="190" font-family="sans-serif" font-size="8.5" fill="#334155">• Rollout is paused/stalled</text>
  <rect x="520" y="210" width="180" height="50" fill="#ffffff" rx="4" stroke="#f87171" stroke-width="1" />
  <text x="610" y="230" font-family="monospace" font-size="8" font-weight="bold" fill="#b91c1c" text-anchor="middle">Warning: Unhealthy</text>
  <text x="610" y="245" font-family="sans-serif" font-size="8" fill="#7f1d1d" text-anchor="middle">Connection refused :5000</text>

  <path d="M 710 170 L 745 170" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 4: Rollback Recovery -->
  <rect x="750" y="65" width="185" height="210" fill="#eff6ff" rx="8" stroke="#93c5fd" stroke-width="1.5" />
  <text x="842" y="90" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="middle">4. ROLLBACK (REV 3)</text>
  <text x="842" y="110" font-family="monospace" font-size="8.5" fill="#2563eb" text-anchor="middle">kubectl rollout undo</text>
  <text x="760" y="132" font-family="sans-serif" font-size="8" fill="#334155">• Reverts to template rev 1</text>
  <text x="760" y="150" font-family="sans-serif" font-size="8" fill="#334155">• Broken pod 4 terminated</text>
  <rect x="760" y="165" width="165" height="40" fill="#ecfdf5" rx="4" stroke="#6ee7b7" stroke-width="1" />
  <text x="842" y="182" font-family="sans-serif" font-size="8" font-weight="bold" fill="#065f46" text-anchor="middle">All 3 Pods Healthy</text>
  <text x="842" y="196" font-family="monospace" font-size="8" fill="#047857" text-anchor="middle">revision 3 == revision 1</text>
  <text x="842" y="230" font-family="sans-serif" font-size="9" font-weight="bold" fill="#15803d" text-anchor="middle">Zero Downtime Achieved!</text>
  <text x="842" y="250" font-family="monospace" font-size="8" fill="#475569" text-anchor="middle">curl :30080/health 200 OK</text>

  <!-- Bottom Explanatory Strip -->
  <rect x="25" y="290" width="910" height="75" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1" />
  <text x="45" y="312" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e293b">Zero-Downtime Guarantee Mechanics:</text>
  <text x="45" y="330" font-family="sans-serif" font-size="9.5" fill="#475569">Because maxUnavailable=0, Kubernetes never terminates an existing healthy pod until the new pod passes its readinessProbe.</text>
  <text x="45" y="347" font-family="sans-serif" font-size="9.5" fill="#475569">When revision 2 failed due to incorrect port mapping, 100% of incoming production traffic continued uninterrupted on revision 1.</text>
</svg>