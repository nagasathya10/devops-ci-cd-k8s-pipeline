<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
  </defs>
  <rect width="920" height="380" fill="#ffffff" rx="10" stroke="#e2e8f0" stroke-width="1.5" />
  <rect x="0" y="0" width="920" height="42" fill="#0f172a" rx="10 10 0 0" />
  <text x="25" y="27" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">ANSIBLE IDEMPOTENT CONFIGURATION &amp; EVENT-DRIVEN HANDLERS</text>
  <text x="710" y="27" font-family="sans-serif" font-size="11" fill="#94a3b8">Playbook: ansible/playbook.yml</text>

  <!-- Left: Control Node -->
  <rect x="30" y="70" width="220" height="200" fill="#f8fafc" rx="8" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="140" y="95" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Ansible Control Node</text>
  <text x="45" y="120" font-family="monospace" font-size="9.5" fill="#2563eb">ansible-playbook -i</text>
  <text x="45" y="136" font-family="monospace" font-size="9.5" fill="#2563eb">inventory.ini playbook.yml</text>
  <text x="45" y="160" font-family="sans-serif" font-size="9" fill="#475569">Components Loaded:</text>
  <text x="55" y="180" font-family="monospace" font-size="8.5" fill="#334155">• inventory.ini [appservers]</text>
  <text x="55" y="197" font-family="monospace" font-size="8.5" fill="#334155">• roles/todo_app/tasks</text>
  <text x="55" y="214" font-family="monospace" font-size="8.5" fill="#334155">• roles/todo_app/templates</text>
  <text x="55" y="231" font-family="monospace" font-size="8.5" fill="#334155">• roles/todo_app/handlers</text>
  <text x="55" y="248" font-family="monospace" font-size="8.5" fill="#334155">• defaults/main.yml</text>

  <path d="M 250 170 L 300 170" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <text x="275" y="160" font-family="sans-serif" font-size="9" font-weight="bold" fill="#475569" text-anchor="middle">SSH</text>

  <!-- Middle: Role Tasks -->
  <rect x="305" y="70" width="270" height="200" fill="#f0fdf4" rx="8" stroke="#86efac" stroke-width="1.5" />
  <text x="440" y="95" font-family="sans-serif" font-size="12" font-weight="bold" fill="#065f46" text-anchor="middle">Role Tasks Execution</text>
  <text x="320" y="120" font-family="monospace" font-size="9" fill="#1e293b">1. Create system user todoapp</text>
  <text x="320" y="140" font-family="monospace" font-size="9" fill="#1e293b">2. Ensure /opt/todo-api exists</text>
  <text x="320" y="160" font-family="monospace" font-size="9" fill="#1e293b">3. Deploy Flask application code</text>
  <text x="320" y="180" font-family="monospace" font-size="9" fill="#1e293b">4. Setup venv &amp; pip requirements</text>
  <text x="320" y="200" font-family="monospace" font-size="9" fill="#1e293b">5. Template todo-app.service.j2</text>
  <text x="335" y="218" font-family="sans-serif" font-size="8.5" font-weight="bold" fill="#b45309">notify: Restart todo-app service</text>
  <text x="320" y="240" font-family="monospace" font-size="9" fill="#1e293b">6. Enable &amp; Start systemd unit</text>

  <!-- Branches for First Run vs Second Run -->
  <path d="M 575 130 L 640 100" stroke="#b45309" stroke-width="2" marker-end="url(#arrow)" />
  <text x="600" y="105" font-family="sans-serif" font-size="9" font-weight="bold" fill="#b45309">First Run</text>

  <path d="M 575 210 L 640 230" stroke="#047857" stroke-width="2" marker-end="url(#arrow)" />
  <text x="600" y="235" font-family="sans-serif" font-size="9" font-weight="bold" fill="#047857">Second Run</text>

  <!-- Right Top: Handler execution -->
  <rect x="645" y="60" width="245" height="100" fill="#fffbeb" rx="8" stroke="#fcd34d" stroke-width="1.5" />
  <text x="767" y="82" font-family="sans-serif" font-size="11" font-weight="bold" fill="#92400e" text-anchor="middle">State Changed -> Handler Fired</text>
  <text x="660" y="105" font-family="monospace" font-size="8.5" fill="#334155">RUNNING HANDLER [Restart service]</text>
  <text x="660" y="122" font-family="monospace" font-size="8.5" fill="#b45309">systemctl daemon-reload</text>
  <text x="660" y="139" font-family="monospace" font-size="8.5" fill="#b45309">systemctl restart todo-app</text>
  <text x="660" y="152" font-family="sans-serif" font-size="8.5" font-weight="bold" fill="#047857">PLAY RECAP: changed=6, failed=0</text>

  <!-- Right Bottom: Idempotency guaranteed -->
  <rect x="645" y="175" width="245" height="95" fill="#f0fdf4" rx="8" stroke="#86efac" stroke-width="1.5" />
  <text x="767" y="197" font-family="sans-serif" font-size="11" font-weight="bold" fill="#065f46" text-anchor="middle">Idempotent Run (No Drift)</text>
  <text x="660" y="218" font-family="sans-serif" font-size="8.5" fill="#334155">Desired state matches actual state.</text>
  <text x="660" y="235" font-family="sans-serif" font-size="8.5" fill="#047857">Handler is NOT triggered.</text>
  <text x="660" y="255" font-family="monospace" font-size="8.5" font-weight="bold" fill="#065f46">PLAY RECAP: changed=0, ok=6</text>

  <!-- Bottom Explanatory Strip -->
  <rect x="30" y="290" width="860" height="70" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1" />
  <text x="50" y="312" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e293b">Idempotency &amp; Handler Guarantee:</text>
  <text x="50" y="330" font-family="sans-serif" font-size="10" fill="#475569">• Idempotency ensures running Ansible multiple times produces the exact same state without unintended disruptions.</text>
  <text x="50" y="346" font-family="sans-serif" font-size="10" fill="#475569">• Handlers run only when tasks notify them via state change, avoiding unnecessary service restarts and dropped connections.</text>
</svg>