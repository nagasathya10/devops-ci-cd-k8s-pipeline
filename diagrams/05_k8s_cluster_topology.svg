<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 400" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
  </defs>
  <rect width="950" height="400" fill="#ffffff" rx="10" stroke="#e2e8f0" stroke-width="1.5" />
  <rect x="0" y="0" width="950" height="42" fill="#0f172a" rx="10 10 0 0" />
  <text x="25" y="27" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">KUBERNETES CLUSTER SERVICE &amp; POD ARCHITECTURE</text>
  <text x="710" y="27" font-family="sans-serif" font-size="11" fill="#94a3b8">NodePort: 30080 | Target: 5000</text>

  <!-- Client Browser / Curl -->
  <rect x="25" y="145" width="130" height="90" fill="#f8fafc" rx="8" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="90" y="172" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Client HTTP</text>
  <text x="90" y="195" font-family="monospace" font-size="9" fill="#2563eb" text-anchor="middle">curl :30080/todos</text>
  <text x="90" y="215" font-family="sans-serif" font-size="8.5" fill="#64748b" text-anchor="middle">REST Requests</text>

  <path d="M 155 190 L 210 190" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- NodePort Service Box -->
  <rect x="215" y="90" width="190" height="200" fill="#f0f9ff" rx="8" stroke="#38bdf8" stroke-width="1.5" />
  <text x="310" y="118" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0369a1" text-anchor="middle">K8s NodePort Service</text>
  <text x="310" y="136" font-family="monospace" font-size="10" fill="#0284c7" text-anchor="middle">todo-api-service</text>
  <text x="230" y="165" font-family="sans-serif" font-size="9" fill="#334155">• NodePort: 30080</text>
  <text x="230" y="185" font-family="sans-serif" font-size="9" fill="#334155">• ClusterIP: 10.96.120.45</text>
  <text x="230" y="205" font-family="sans-serif" font-size="9" fill="#334155">• TargetPort: 5000</text>
  <text x="230" y="225" font-family="sans-serif" font-size="9" fill="#334155">• Selector: app=todo-api</text>
  <text x="230" y="255" font-family="monospace" font-size="8.5" fill="#0284c7">Endpoints Controller</text>
  <text x="230" y="272" font-family="monospace" font-size="8" fill="#64748b">Round-Robin Balancing</text>

  <!-- Fan-out Arrows to Pods -->
  <path d="M 405 160 L 460 100" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 405 190 L 460 190" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 405 220 L 460 280" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Pod 1 -->
  <rect x="465" y="65" width="220" height="75" fill="#f0fdf4" rx="6" stroke="#86efac" stroke-width="1.5" />
  <text x="475" y="85" font-family="monospace" font-size="10" font-weight="bold" fill="#065f46">Pod 1: todo-api-7b89-w1</text>
  <text x="475" y="103" font-family="monospace" font-size="8.5" fill="#047857">IP: 10.244.0.12 | Port 5000</text>
  <text x="475" y="120" font-family="sans-serif" font-size="8.5" fill="#334155">Flask REST API (Running &amp; Ready)</text>

  <!-- Pod 2 -->
  <rect x="465" y="155" width="220" height="75" fill="#f0fdf4" rx="6" stroke="#86efac" stroke-width="1.5" />
  <text x="475" y="175" font-family="monospace" font-size="10" font-weight="bold" fill="#065f46">Pod 2: todo-api-7b89-w2</text>
  <text x="475" y="193" font-family="monospace" font-size="8.5" fill="#047857">IP: 10.244.0.13 | Port 5000</text>
  <text x="475" y="210" font-family="sans-serif" font-size="8.5" fill="#334155">Flask REST API (Running &amp; Ready)</text>

  <!-- Pod 3 -->
  <rect x="465" y="245" width="220" height="75" fill="#f0fdf4" rx="6" stroke="#86efac" stroke-width="1.5" />
  <text x="475" y="265" font-family="monospace" font-size="10" font-weight="bold" fill="#065f46">Pod 3: todo-api-7b89-w3</text>
  <text x="475" y="283" font-family="monospace" font-size="8.5" fill="#047857">IP: 10.244.0.14 | Port 5000</text>
  <text x="475" y="300" font-family="sans-serif" font-size="8.5" fill="#334155">Flask REST API (Running &amp; Ready)</text>

  <!-- Right: Health Probes & ConfigMap -->
  <rect x="715" y="65" width="210" height="120" fill="#fffbeb" rx="8" stroke="#fcd34d" stroke-width="1.5" />
  <text x="820" y="88" font-family="sans-serif" font-size="11" font-weight="bold" fill="#92400e" text-anchor="middle">Health Probes Config</text>
  <text x="725" y="110" font-family="monospace" font-size="8.5" fill="#1e293b">• livenessProbe: /health</text>
  <text x="735" y="125" font-family="sans-serif" font-size="8" fill="#64748b">delay: 10s, period: 5s</text>
  <text x="725" y="145" font-family="monospace" font-size="8.5" fill="#1e293b">• readinessProbe: /health</text>
  <text x="735" y="160" font-family="sans-serif" font-size="8" fill="#64748b">delay: 5s, period: 5s</text>
  <text x="725" y="175" font-family="sans-serif" font-size="8" font-weight="bold" fill="#047857">Gates traffic until ready</text>

  <rect x="715" y="200" width="210" height="120" fill="#fdf4ff" rx="8" stroke="#f0abfc" stroke-width="1.5" />
  <text x="820" y="223" font-family="sans-serif" font-size="11" font-weight="bold" fill="#701a75" text-anchor="middle">ConfigMap: todo-api-config</text>
  <text x="725" y="248" font-family="monospace" font-size="8.5" fill="#334155">• APP_ENV: "production"</text>
  <text x="725" y="268" font-family="monospace" font-size="8.5" fill="#334155">• APP_PORT: "5000"</text>
  <text x="725" y="288" font-family="monospace" font-size="8.5" fill="#334155">• APP_DEBUG: "false"</text>
  <text x="725" y="306" font-family="sans-serif" font-size="8" fill="#64748b">Injected as pod env variables</text>

  <!-- Footer note -->
  <rect x="25" y="335" width="900" height="50" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1" />
  <text x="45" y="355" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1e293b">Cluster High Availability Architecture:</text>
  <text x="45" y="372" font-family="sans-serif" font-size="9" fill="#475569">Pods are horizontally scalable from 3 to 5 replicas. NodePort 30080 allows external access while endpoints provide seamless round-robin load distribution.</text>
</svg>