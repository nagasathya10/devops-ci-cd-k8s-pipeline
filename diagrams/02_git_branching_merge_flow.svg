  <text x="70" y="338" font-family="sans-serif" font-size="10" fill="#475569">1. Protected production branch ('main') enforces clean build stability and CI automation.</text>
  <text x="70" y="352" font-family="sans-serif" font-size="10" fill="#475569">2. Dedicated isolated feature branch ('feature/todo-endpoints') with non-fast-forward merge preservation (--no-ff).</text>
