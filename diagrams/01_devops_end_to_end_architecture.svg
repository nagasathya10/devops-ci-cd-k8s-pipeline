<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="520" fill="#f8fafc" rx="12" />
  <rect x="15" y="15" width="970" height="490" fill="#ffffff" rx="8" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)" />

  <!-- Header -->
  <rect x="15" y="15" width="970" height="50" fill="#0f172a" rx="8 8 0 0" />
  <text x="35" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff">END-TO-END DEVOPS AUTOMATION ARCHITECTURE</text>
  <text x="680" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">CI/CD, CONFIG MANAGEMENT &amp; KUBERNETES</text>

  <!-- Stage 1: Developer Workstation & SCM -->
  <rect x="40" y="90" width="180" height="380" fill="#f1f5f9" rx="8" stroke="#cbd5e1" stroke-width="1.5" />
  <rect x="40" y="90" width="180" height="35" fill="url(#blueGrad)" rx="8 8 0 0" />
  <text x="130" y="113" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">1. SOURCE CODE SCM</text>

  <rect x="55" y="140" width="150" height="65" fill="#ffffff" rx="6" stroke="#93c5fd" stroke-width="1" />
  <text x="130" y="162" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Local Git Workstation</text>
  <text x="130" y="180" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">feature/todo-endpoints</text>
  <text x="130" y="195" font-family="monospace" font-size="10" fill="#2563eb" text-anchor="middle">make test &amp; pytest</text>

  <path d="M 130 205 L 130 230" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)" />

  <rect x="55" y="240" width="150" height="75" fill="#ffffff" rx="6" stroke="#93c5fd" stroke-width="1" />
  <text x="130" y="262" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">GitHub Repository</text>
  <text x="130" y="280" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Branch: main</text>
  <text x="130" y="295" font-family="sans-serif" font-size="10" fill="#10b981" text-anchor="middle">PR #1 Merged (--no-ff)</text>
  <text x="130" y="307" font-family="monospace" font-size="9" fill="#0f172a" text-anchor="middle">git SHA: dynamic</text>

  <rect x="55" y="340" width="150" height="110" fill="#eff6ff" rx="6" stroke="#bfdbfe" stroke-width="1" />
  <text x="130" y="360" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Source Artifacts</text>
  <text x="65" y="380" font-family="monospace" font-size="10" fill="#334155">• app/app.py (REST)</text>
  <text x="65" y="398" font-family="monospace" font-size="10" fill="#334155">• app/test_app.py</text>
  <text x="65" y="416" font-family="monospace" font-size="10" fill="#334155">• Jenkinsfile</text>
  <text x="65" y="434" font-family="monospace" font-size="10" fill="#334155">• Dockerfile &amp; k8s/</text>

  <!-- Arrow SCM -> CI -->
  <path d="M 220 277 L 275 277" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <text x="247" y="268" font-family="sans-serif" font-size="9" font-weight="bold" fill="#475569" text-anchor="middle">Poll SCM</text>

  <!-- Stage 2: Continuous Integration -->
  <rect x="280" y="90" width="200" height="380" fill="#f1f5f9" rx="8" stroke="#cbd5e1" stroke-width="1.5" />
  <rect x="280" y="90" width="200" height="35" fill="url(#purpleGrad)" rx="8 8 0 0" />
  <text x="380" y="113" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2. CONTINUOUS INTEGRATION</text>

  <rect x="295" y="135" width="170" height="150" fill="#ffffff" rx="6" stroke="#c084fc" stroke-width="1" />
  <text x="380" y="155" font-family="sans-serif" font-size="12" font-weight="bold" fill="#581c87" text-anchor="middle">Jenkins CI Engine</text>
  <text x="305" y="175" font-family="monospace" font-size="10" fill="#334155">1. SCM Checkout (HEAD)</text>
  <text x="305" y="193" font-family="monospace" font-size="10" fill="#334155">2. Setup Python Venv</text>
  <text x="305" y="211" font-family="monospace" font-size="10" fill="#2563eb">3. Pytest (8/8 Passed)</text>
  <text x="305" y="229" font-family="monospace" font-size="10" fill="#334155">4. Build tar.gz Package</text>
  <text x="305" y="247" font-family="monospace" font-size="10" fill="#10b981">5. Docker Multi-Stage</text>
  <text x="305" y="265" font-family="monospace" font-size="10" fill="#7c3aed">6. Archive &amp; JUnit XML</text>

  <path d="M 380 285 L 380 305" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="295" y="315" width="170" height="135" fill="#faf5ff" rx="6" stroke="#e9d5ff" stroke-width="1" />
  <text x="380" y="335" font-family="sans-serif" font-size="11" font-weight="bold" fill="#6b21a8" text-anchor="middle">GitHub Actions Matrix</text>
  <text x="305" y="355" font-family="monospace" font-size="10" fill="#334155">• Matrix: Py 3.10 / 3.11</text>
  <text x="305" y="375" font-family="monospace" font-size="10" fill="#334155">• Linting &amp; Pytest</text>
  <text x="305" y="395" font-family="monospace" font-size="10" fill="#334155">• Docker Build Validated</text>
  <text x="305" y="415" font-family="monospace" font-size="10" fill="#334155">• Artifact: todo-api-dist</text>
  <text x="305" y="435" font-family="sans-serif" font-size="9" font-weight="bold" fill="#10b981">Status: Success (All Green)</text>

  <!-- Arrow CI -> Config & Deploy -->
  <path d="M 480 210 L 535 210" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <text x="507" y="200" font-family="sans-serif" font-size="9" font-weight="bold" fill="#475569" text-anchor="middle">Package</text>

  <path d="M 480 380 L 735 380" stroke="#475569" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)" />
  <text x="607" y="372" font-family="sans-serif" font-size="9" font-weight="bold" fill="#475569" text-anchor="middle">Docker Image todo-api:1.0</text>

  <!-- Stage 3: Ansible Configuration Management -->
  <rect x="540" y="90" width="190" height="250" fill="#f1f5f9" rx="8" stroke="#cbd5e1" stroke-width="1.5" />
  <rect x="540" y="90" width="190" height="35" fill="url(#amberGrad)" rx="8 8 0 0" />
  <text x="635" y="113" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">3. ANSIBLE AUTOMATION</text>

  <rect x="555" y="135" width="160" height="190" fill="#ffffff" rx="6" stroke="#fcd34d" stroke-width="1" />
  <text x="635" y="155" font-family="sans-serif" font-size="11" font-weight="bold" fill="#92400e" text-anchor="middle">Ansible Role: todo_app</text>
  <text x="565" y="175" font-family="monospace" font-size="9" fill="#334155">• System User (UID: todo)</text>
  <text x="565" y="192" font-family="monospace" font-size="9" fill="#334155">• /opt/todo-api Directory</text>
  <text x="565" y="209" font-family="monospace" font-size="9" fill="#334155">• Deploy Virtualenv</text>
  <text x="565" y="226" font-family="monospace" font-size="9" fill="#334155">• Jinja2 Systemd Unit</text>
  <text x="565" y="243" font-family="monospace" font-size="9" fill="#b45309">• notify: Restart Service</text>
  <text x="565" y="260" font-family="monospace" font-size="9" fill="#047857">• Idempotency: changed=0</text>
  <text x="565" y="280" font-family="sans-serif" font-size="9" font-weight="bold" fill="#0f172a">Managed Host VM</text>
  <text x="565" y="297" font-family="monospace" font-size="9" fill="#2563eb">systemctl status todo-app</text>
  <text x="565" y="312" font-family="sans-serif" font-size="9" fill="#10b981">Active (running) :5000</text>

  <!-- Stage 4: Kubernetes Orchestration -->
  <rect x="745" y="90" width="220" height="380" fill="#f1f5f9" rx="8" stroke="#cbd5e1" stroke-width="1.5" />
  <rect x="745" y="90" width="220" height="35" fill="url(#emeraldGrad)" rx="8 8 0 0" />
  <text x="855" y="113" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">4. KUBERNETES CLUSTER</text>

  <rect x="755" y="135" width="200" height="55" fill="#ffffff" rx="6" stroke="#6ee7b7" stroke-width="1" />
  <text x="855" y="152" font-family="sans-serif" font-size="11" font-weight="bold" fill="#065f46" text-anchor="middle">NodePort Service :30080</text>
  <text x="855" y="168" font-family="monospace" font-size="9" fill="#047857" text-anchor="middle">Port 5000 -> NodePort 30080</text>
  <text x="855" y="182" font-family="sans-serif" font-size="9" fill="#64748b" text-anchor="middle">ClusterIP &amp; Endpoints Load Balancer</text>

  <path d="M 855 190 L 855 210" stroke="#059669" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="755" y="215" width="200" height="240" fill="#ffffff" rx="6" stroke="#6ee7b7" stroke-width="1" />
  <text x="855" y="235" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">Deployment: todo-api</text>
  <text x="855" y="250" font-family="monospace" font-size="9" fill="#2563eb" text-anchor="middle">Replicas: 3 (Scalable to 5)</text>

  <!-- Pod 1 -->
  <rect x="765" y="260" width="180" height="40" fill="#ecfdf5" rx="4" stroke="#a7f3d0" stroke-width="1" />
  <text x="775" y="275" font-family="monospace" font-size="9" font-weight="bold" fill="#065f46">Pod 1: todo-api-7b89-1</text>
  <text x="775" y="290" font-family="monospace" font-size="8" fill="#047857">10.244.0.12 | /health UP [200]</text>

  <!-- Pod 2 -->
  <rect x="765" y="305" width="180" height="40" fill="#ecfdf5" rx="4" stroke="#a7f3d0" stroke-width="1" />
  <text x="775" y="320" font-family="monospace" font-size="9" font-weight="bold" fill="#065f46">Pod 2: todo-api-7b89-2</text>
  <text x="775" y="335" font-family="monospace" font-size="8" fill="#047857">10.244.0.13 | /health UP [200]</text>

  <!-- Pod 3 -->
  <rect x="765" y="350" width="180" height="40" fill="#ecfdf5" rx="4" stroke="#a7f3d0" stroke-width="1" />
  <text x="775" y="365" font-family="monospace" font-size="9" font-weight="bold" fill="#065f46">Pod 3: todo-api-7b89-3</text>
  <text x="775" y="380" font-family="monospace" font-size="8" fill="#047857">10.244.0.14 | /health UP [200]</text>

  <!-- ConfigMap & Rollback box -->
  <rect x="765" y="395" width="180" height="50" fill="#eff6ff" rx="4" stroke="#bfdbfe" stroke-width="1" />
  <text x="775" y="410" font-family="sans-serif" font-size="8.5" font-weight="bold" fill="#1e3a8a">ConfigMap: APP_ENV=production</text>
  <text x="775" y="425" font-family="sans-serif" font-size="8" fill="#334155">Probes: Liveness &amp; Readiness (5s)</text>
  <text x="775" y="438" font-family="sans-serif" font-size="8" font-weight="bold" fill="#b91c1c">Zero-Downtime Rollback: Undo v1.1</text>

  <!-- Footer -->
  <text x="500" y="495" font-family="sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">Department of CSE (Cyber Security) • M. S. Ramaiah Institute of Technology • Course: 24CYAEC59</text>
</svg>